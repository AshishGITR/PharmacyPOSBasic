name: React CI

on:
  push:
    branches:
      - main
    paths:
      - 'Pharmacy_POS_UI/**'

  pull_request:
    branches:
      - main
    paths:
      - 'Pharmacy_POS_UI/**'

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Pharmacy_POS_UI

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Pharmacy_POS_UI/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build
